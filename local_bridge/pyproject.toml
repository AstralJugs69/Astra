[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "braille-errata-relay-bridge"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
relay-bridge = "relay_bridge.main:main"

[project.optional-dependencies]
cups = ["pycups>=2.0,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/relay_bridge"]
