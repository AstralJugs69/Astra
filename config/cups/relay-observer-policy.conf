# CUPS policy template for the separate relay-observer identity.
# Deploy into a pinned CUPS 2.x installation and verify each denial in WSL.
# This file is documentation/configuration only; the Relay has no CUPS command port.
<Limit Get-Jobs Get-Job-Attributes Get-Printer-Attributes CUPS-Get-Printers>
  Order allow,deny
  Allow User relay-observer
</Limit>

<Limit Print-Job Create-Job Send-Document Hold-Job Release-Job Cancel-Job Restart-Job>
  Order deny,allow
  Deny User relay-observer
</Limit>
