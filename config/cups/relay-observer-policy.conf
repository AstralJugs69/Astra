# Gate 0 policy for the separate relay-observer and relay-operator identities.
#
# DefaultPolicy must point at relay-observer in the CUPS server configuration.
# The policy name describes the Relay-facing least-privilege surface; the
# human operator remains explicitly authorized for production queue operations.
# The Relay bridge never receives a CUPS mutation endpoint or command surface.

<Policy relay-observer>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  # Both identities may observe queue and job state. No document bytes are
  # exposed by these operations.
  <Limit Get-Jobs Get-Job-Attributes Get-Printer-Attributes Get-Printers CUPS-Get-Printers>
    AuthType Basic
    Require user relay-observer relay-operator
    Order allow,deny
  </Limit>

  # Only the human operator or a configured CUPS administrator may submit or
  # mutate jobs. relay-observer is intentionally absent.
  <Limit Create-Job Print-Job Print-URI Validate-Job Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job Cancel-Job CUPS-Authenticate-Job>
    AuthType Basic
    Require user relay-operator @SYSTEM
    Order deny,allow
  </Limit>

  # A Relay observer must not retrieve the raw CUPS spool document.
  <Limit CUPS-Get-Document>
    AuthType Basic
    Require user relay-operator @SYSTEM
    Order deny,allow
  </Limit>

  # Administration, printer control, and queue acceptance/rejection remain
  # outside the Relay observer surface.
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Basic
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Basic
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  # Any IPP operation not explicitly allowlisted above is denied.
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>