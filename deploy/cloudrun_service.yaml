apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: astra-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/astra-backend:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
        env:
        - name: ASTRA_ENV
          value: "prod"
        - name: ASTRA_PERSISTENCE_BACKEND
          value: "FIRESTORE"
        - name: FIRESTORE_PROJECT_ID
          value: "PROJECT_ID"
        - name: ASTRA_FAST_MODEL
          value: "gemini-2.5-flash"
        - name: ASTRA_DEEP_MODEL
          value: "gemini-2.5-flash"
        - name: ASTRA_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: astra-auth-token
              key: latest
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: latest
