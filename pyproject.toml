[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "braille-errata-relay"
version = "0.1.0"
description = "Report-first Braille production errata investigation overlay"
requires-python = ">=3.11,<3.13"
dependencies = [
  "google-adk[gcp]>=2.6,<3",
  "google-api-python-client>=2,<3",
  "google-auth>=2,<3",
  "google-auth-oauthlib>=1,<2",
  "google-cloud-firestore>=2,<3",
  "google-cloud-storage>=3,<4",
  "google-cloud-pubsub>=2,<3",
  "google-cloud-secret-manager>=2,<3",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "tenacity>=9,<10",
  "cloudevents>=1.11,<2",
]

[project.scripts]
braille-relay = "braille_errata_relay.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "hypothesis>=6.120,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/braille_errata_relay"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "liblouis: requires the pinned upstream Liblouis Python binding",
  "integration: requires an external service or local production floor",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/braille_errata_relay"]
